# A paid service is required for the persistent disk. Review pricing in Render.
services:
  - type: web
    name: forensic-drug-analysis-api
    runtime: python
    plan: 1c-2g
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --host 0.0.0.0
    healthCheckPath: /api/status
    disk:
      name: forensic-records
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: FORENSIC_STORAGE_DIR
        value: /var/data/forensic
      - key: FORENSIC_ALLOWED_ORIGINS
        sync: false
      - key: OPENBLAS_NUM_THREADS
        value: "1"
